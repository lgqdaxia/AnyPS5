name: PR15058 mapped-copy Linux

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR under validation
        type: string
        default: "15058"
        required: true

permissions:
  contents: read

jobs:
  mapped-copy:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CCACHE_DISABLE: '1'
      ANYPS5_NO_SHADER_CACHE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8378a3d27c0a64b0265ab9a7809ea1b9744e7573
          persist-credentials: false
          submodules: recursive
      - name: Record source and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8378a3d27c0a64b0265ab9a7809ea1b9744e7573'
          git status --short
          uname -a
          cat /etc/os-release
          gcc --version
          g++ --version
          cmake --version
          sha256sum core/libs/prx/libSceAgcDriver/tests/MappedCopy.cpp core/libs/prx/libc/src/GuestArena.cpp core/libs/prx/libSceAgcDriver/Execution/src/GuestMemory.cpp
          free -h
          df -h .
      - name: Install platform build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxss-dev libxfixes-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl-dev libgl-dev libdecor-0-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libvulkan-dev
      - name: Configure the real project
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DANYPS5_ENABLE_SPIRV_TOOLS=OFF -DANYPS5_AGC_EXECUTION_TESTS=RegistrationPrepareShutdown
      - name: Build the mapped-copy test target
        shell: bash
        run: |
          set -euo pipefail
          jobs=$(python3 -c 'import os; m=int(next(x.split()[1] for x in open("/proc/meminfo") if x.startswith("MemAvailable:")))//1024; print(max(1,min(3,os.cpu_count(),(m-2048)//2048)))')
          echo "Building agc_mapped_copy_tests with $jobs compiler jobs"
          timeout --signal=TERM --kill-after=15s 35m cmake --build build --target agc_mapped_copy_tests --parallel "$jobs"
      - name: Run exactly seven mapped-copy CPU tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -R '^agc_mapped_copy_' --show-only=json-v1 > "$RUNNER_TEMP/mapped-copy-tests.json"
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'mapped-copy-tests.json')
          names = sorted(t['name'] for t in json.load(open(path))['tests'])
          expected = sorted('agc_mapped_copy_' + m for m in ['valid', 'reset', 'partial', 'reuse', 'boundaries', 'hooks', 'committed'])
          assert names == expected, (names, expected)
          print('Selected exactly seven CPU tests:', ', '.join(names))
          PY
          ctest --test-dir build -R '^agc_mapped_copy_' -V -j 1 --no-tests=error --output-junit "$RUNNER_TEMP/mapped-copy-results.xml"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'mapped-copy-results.xml')).getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 7
          assert not list(root.iter('failure')) and not list(root.iter('error')) and not list(root.iter('skipped'))
          print('MAPPED_COPY_RESULT: 7 passed, 0 failed, 0 skipped')
          PY
          sha256sum build/tests/agc_mapped_copy_tests
          git diff --exit-code
          git diff --cached --exit-code
